<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TERMS 生成ツール</title>
  <style>
    body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;margin:16px;line-height:1.5}
    textarea{width:100%;min-height:220px;border:1px solid #ccc;border-radius:12px;padding:12px;font-size:14px}
    button{padding:10px 12px;border-radius:12px;border:1px solid #ccc;background:#fff;margin:6px 0}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    code{background:#f4f4f4;padding:2px 6px;border-radius:6px}
    .out{min-height:220px}
  </style>
</head>
<body>
  <h1>TERMS生成ツール</h1>
  <p>
    下の欄に「用語」を1行1語で貼り付け → 学年/分野を選択 → 生成 を押す。<br>
    出力を <code>terms.js</code> に貼り付ければ増やせる。
  </p>

  <div class="row">
    <label>学年：
      <select id="grade">
        <option value="1">1年</option>
        <option value="2">2年</option>
        <option value="3">3年</option>
      </select>
    </label>

    <label>分野：
      <select id="field">
        <option value="life">生命</option>
        <option value="chem">物質</option>
        <option value="phys">エネルギー</option>
        <option value="earth">地球</option>
      </select>
    </label>

    <button id="gen">生成</button>
    <button id="copy">出力をコピー</button>
  </div>

  <h2>入力（1行1語）</h2>
  <textarea id="in" placeholder="例：
細胞
核
葉緑体
…"></textarea>

  <h2>出力（terms.jsに追記する用）</h2>
  <textarea id="out" class="out" readonly></textarea>

<script>
const $ = (id)=>document.getElementById(id);
function escapeJS(s){ return s.replace(/\\/g,"\\\\").replace(/"/g,'\\"'); }

$("gen").onclick = ()=>{
  const grade = Number($("grade").value);
  const field = $("field").value;
  const lines = $("in").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);

  const objs = lines.map(term=>{
    // hintは空でOK（アプリ側で自動ヒントが入るようにする）
    return `{ grade:${grade}, field:"${field}", term:"${escapeJS(term)}", hint:"" }`;
  });

  $("out").value = objs.join(",\n") + (objs.length? ",\n":"");
};

$("copy").onclick = async ()=>{
  try{
    await navigator.clipboard.writeText($("out").value);
    alert("コピーしました。terms.js に貼り付けてOK！");
  }catch{
    alert("コピーできませんでした。出力欄を長押し→全選択→コピーでお願いします。");
  }
};
</script>
</body>
</html>
