<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TERMS 生成ツール（####抽出版）</title>
  <style>
    body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;margin:16px;line-height:1.5}
    textarea{width:100%;min-height:220px;border:1px solid #ccc;border-radius:12px;padding:12px;font-size:14px}
    button,select{padding:10px 12px;border-radius:12px;border:1px solid #ccc;background:#fff;margin:6px 0}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    code{background:#f4f4f4;padding:2px 6px;border-radius:6px}
    .out{min-height:220px}
    .note{color:#555;font-size:12px}
  </style>
</head>
<body>
  <h1>TERMS生成ツール（#### 抽出）</h1>
  <p class="note">
    入力に <code>#### 用語</code> と説明文が混ざっていてもOK。<br>
    出力は「公開用（hint空）」と「メモ用（desc_raw付き）」の2種類。
  </p>

  <div class="row">
    <label>学年：
      <select id="grade">
        <option value="1">1年</option>
        <option value="2">2年</option>
        <option value="3">3年</option>
      </select>
    </label>

    <label>分野：
      <select id="field">
        <option value="life">生命</option>
        <option value="chem">物質</option>
        <option value="phys">エネルギー</option>
        <option value="earth">地球</option>
      </select>
    </label>

    <button id="gen">抽出して生成</button>
    <button id="copy">出力をコピー</button>
  </div>

  <h2>入力（#### 用語 + 説明 を貼ってOK）</h2>
  <textarea id="in"></textarea>

  <h2>出力（公開用：terms.js に追記）</h2>
  <textarea id="out" class="out" readonly></textarea>

  <h2>出力（メモ用：原文説明つき / 公開には使わない）</h2>
  <textarea id="outMemo" class="out" readonly></textarea>

<script>
const $ = (id)=>document.getElementById(id);
function esc(s){
  return String(s).replace(/\\/g,"\\\\").replace(/"/g,'\\"');
}

// #### 用語 の後ろの説明を次の #### まで集める
function parseTerms(text){
  const lines = text.split(/\r?\n/).map(s => s.replace(/\u00A0/g, " ")); // NBSP対策

  // ① このへんの「見出しっぽい行」は無視したい
  const isJunk = (line) => {
    const t = line.trim();
    if (!t) return true;
    if (/^LastUpDate/i.test(t)) return true;
    if (t === "中学理科の用語集") return true;
    if (t === "用語検索") return true;
    if (t.includes("全範囲") || t.includes("1年") || t.includes("2年") || t.includes("3年")) return true;
    if (t === "理科の重要用語") return true;
    if (t === "キーワード検索") return true;
    if (t === "一覧から選択") return true;
    if (t === "コンテンツ") return true;
    if (t.startsWith("http") || t.startsWith("©")) return true;
    if (t.includes("science.005net.com")) return true;
    return false;
  };

  // ② 「これは用語っぽい」を判定（短め／句点なし／見出しや説明ではない）
  const looksLikeTerm = (line) => {
    const t = line.trim();
    if (!t) return false;
    if (isJunk(t)) return false;
    if (t.length > 18) return false;              // 長すぎるのは説明っぽい
    if (t.includes("。")) return false;            // 句点があるのは説明文っぽい
    if (t.startsWith("基本的な使い方")) return false;
    if (t.startsWith("例")) return false;
    if (t.startsWith("被子植物") || t.startsWith("裸子植物")) return false; // 「花のつくり」直下の見出し対策
    return true;
  };

  const items = [];
  let current = null;

  // ③ まず `#### 用語` 形式を優先して抽出（あるなら確実）
  const hasH4 = lines.some(l => /^\s*####\s+/.test(l.trim()));
  if (hasH4){
    for (const raw of lines){
      const line = raw.trim();
      if (/^\s*####\s+/.test(line)){
        if (current){
          current.desc = current.desc.join(" ").trim();
          items.push(current);
        }
        const term = line.replace(/^\s*####\s+/, "").trim();
        current = { term, desc: [] };
        continue;
      }
      if (current){
        const t = raw.trim();
        if (!t) continue;
        // 次の大見出し以降のゴミを避けたい
        if (t.startsWith("## ") || t.startsWith("# ")) continue;
        if (t.startsWith("http") || t.startsWith("©")) continue;
        current.desc.push(t);
      }
    }
    if (current){
      current.desc = current.desc.join(" ").trim();
      items.push(current);
    }
  } else {
    // ④ `####` が無いとき：用語(単独行) → 説明 → 空行、という形で抽出
    for (let i=0; i<lines.length; i++){
      const line = lines[i].trim();

      if (isJunk(line)) continue;

      if (looksLikeTerm(line)){
        // 新しい用語開始
        if (current){
          current.desc = current.desc.join(" ").trim();
          if (current.term) items.push(current);
        }
        current = { term: line, desc: [] };
        continue;
      }

      // 説明の行
      if (current){
        const t = line;
        if (!t){
          // 空行で区切り
          current.desc = current.desc.join(" ").trim();
          items.push(current);
          current = null;
        } else if (!isJunk(t)) {
          current.desc.push(t);
        }
      }
    }
    if (current){
      current.desc = current.desc.join(" ").trim();
      items.push(current);
    }
  }

  // ⑤ 重複除去
  const seen = new Set();
  return items
    .filter(x => x.term && !seen.has(x.term) && (seen.add(x.term), true))
    .map(x => ({ term: x.term, desc: x.desc || "" }));
}
  function shortHintFromDesc(desc){
  let s = String(desc || "").replace(/\s+/g, " ").trim();

  // よくある前置き削除
  s = s.replace(/^.+?とは、?/, "");
  s = s.replace(/^.+?は、?/, "");
  s = s.replace(/例・・・.*$/, "");
  s = s.replace(/基本的な使い方.*$/, "");

  // 句点で切って先頭文だけ
  if (s.includes("。")) s = s.split("。")[0] + "。";

  // それでも長ければカット（最後に…）
  const max = 26;
  if (s.length > max) s = s.slice(0, max-1) + "…";

  if (s.length < 4) return "";
  return s;
  }
$("gen").onclick = ()=>{
  const grade = Number($("grade").value);
  const field = $("field").value;

  const parsed = parseTerms($("in").value);

const pub = parsed.map(x => {
  const hint = shortHintFromDesc(x.desc);
  return `{ grade:${grade}, field:"${field}", term:"${esc(x.term)}", hint:"${esc(hint)}" }`;
}).join(",\n") + (parsed.length ? ",\n" : "");

const memo = parsed.map(x => {
  const hint = shortHintFromDesc(x.desc);
  return `{ grade:${grade}, field:"${field}", term:"${esc(x.term)}", hint:"${esc(hint)}", desc_raw:"${esc(x.desc)}" }`;
}).join(",\n") + (parsed.length ? ",\n" : "");
  $("out").value = pub;
  $("outMemo").value = memo;

  alert(`抽出完了：${parsed.length}語`);
};

$("copy").onclick = async ()=>{
  try{
    await navigator.clipboard.writeText($("out").value);
    alert("公開用（out）をコピーしました。terms.js に貼り付けてOK！");
  }catch{
    alert("コピーできませんでした。出力欄を長押し→全選択→コピーでお願いします。");
  }
};
</script>
</body>
</html>
